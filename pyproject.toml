[project]
name = "foamsim-agent"
version = "0.1.0"
description = "FoamSim-Agent: a validated micromechanics simulation toolkit for hollow-particle composites, agent skills, and a benchmark of coding agents driving it"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Harsh Vardhan Gupta" }]
dependencies = ["numpy>=1.26", "scipy>=1.13", "scikit-fem>=10", "pandas>=2.2", "matplotlib>=3.9", "typer>=0.12", "rich>=13.7", "pydantic>=2.7"]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "python-docx>=1.1"]
[project.scripts]
foamsim = "foamsim.cli:app"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["foamsim"]
[tool.ruff]
line-length = 100
target-version = "py311"
